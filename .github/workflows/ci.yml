name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Integration tests start Postgres via Testcontainers (Docker is preinstalled on the runner)
      - name: Build and test
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t commerce-api .
