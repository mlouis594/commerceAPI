spring.application.name=CommerceAPI

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5332/commerce}
spring.datasource.username=${DB_USERNAME:mlouis594}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# HMAC-SHA256 signing key; must be at least 32 bytes. Override in any shared environment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnop}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}

server.error.include-message=always

# Demo data, loaded into an empty database on startup
app.seed.enabled=${SEED_DATA:true}
app.seed.admin-username=${ADMIN_USERNAME:admin}
app.seed.admin-password=${ADMIN_PASSWORD:admin12345}
