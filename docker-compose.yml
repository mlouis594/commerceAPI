services:
  db:
    container_name: postgres-commerce
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlouis594
      POSTGRES_PASSWORD: password
      POSTGRES_DB: commerce
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlouis594 -d commerce"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Run the whole stack with: docker compose --profile app up --build
  api:
    container_name: commerce-api
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/commerce
      DB_USERNAME: mlouis594
      DB_PASSWORD: password
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789-abcdefghijklmnop}
    ports:
      - "8080:8080"
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge

volumes:
  db:
